---
# Trigger ECE @PrSuite on elastic/cloud master, installing this role branch.
# Do not pass BUILDKITE_PULL_REQUEST through: that number is an ansible-ece PR,
# not an elastic/cloud PR.
#
# Combo defaults to ubuntu_22.04 / docker_25. Override with New Build env or a
# PR comment using ECE_TESTS_OS and ECE_TESTS_CONTAINER_ENGINE:
#   run ece ECE_TESTS_OS=ubuntu_24.04 ECE_TESTS_CONTAINER_ENGINE=docker_29
# ECE_TESTS_CONTAINER_ENGINE is remapped to ECE_TESTS_DOCKER for the matcher.
#
# GitHub Checks: post against this commit so the ansible-ece PR shows a running
# job. Do not forward BUILDKITE_PULL_REQUEST to the matcher (wrong repo's PR #).
notify:
  - github_check:
      name: "buildkite/ansible-ece-prsuite"
  - github_commit_status:
      context: "buildkite/ansible-ece-prsuite"
      blocked_builds_as_pending: true
steps:
  - label: ":pipeline: ECE PrSuite"
    command: bash .buildkite/trigger-prsuite.sh
    agents:
      image: docker.elastic.co/ci-agent-images/basic-buildkite-agent:1715282848
