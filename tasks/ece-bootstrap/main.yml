---
- name: Copy ece installer
  copy:
    src: "{{ ece_installer_path }}"
    dest: /home/elastic/elastic-cloud-enterprise.sh
    mode: 0755
  when: ece_installer_path is defined
  
- name: Download ece installer
  get_url:
    url: "{{ ece_installer_url }}"
    dest: /home/elastic/elastic-cloud-enterprise.sh
    mode: 0755
  when: ece_installer_path is not defined

# ~/.docker/config.json carries the registry credentials needed to pull ECE
# images. Podman reads it via its auth fallback chain, so provision it for both
# Docker and Podman whenever a docker_config is supplied.
- name: Ensure ~/.docker is present
  file:
    path: "{{ ece_docker_config_dir }}"
    state: directory
    owner: elastic
    group: elastic
    mode: "0700"
  when: docker_config != ""

- name: Ensure ~/.config/containers/containers.conf is present
  file:
    path: /home/elastic/.config/containers/
    state: directory
    owner: elastic
  when: container_engine == "Podman"

- name: Copy local Docker config
  copy:
    src: "{{ docker_config }}"
    dest: "{{ ece_docker_config_dir }}/config.json"
    owner: elastic
    group: elastic
    mode: "0600"
  when: docker_config != ""

# The installer only exposes the host docker config for the initial host-side
# image pull; the long-lived runner/allocator containers that pull images at
# runtime never see it, so private-registry runtime pulls fail with
# PullAccessDenied. Stage a container-config mutation that bind-mounts the
# elastic docker config into those containers and pass it to the installer via
# --config-file (see install_stack.yml). Only needed when credentials are set.
- name: Stage registry-auth container-config mutation
  template:
    src: registry-auth.conf.j2
    dest: /home/elastic/registry-auth.conf
    owner: elastic
  when: docker_config != ""

- name: Copy local Podman config
  copy:
    src: "{{ podman_config }}"
    dest: /home/elastic/.config/containers/containers.conf
    owner: elastic
  when: podman_config != "" and container_engine == "Podman"

- name: Ensure the Docker service is started
  systemd:
    name: docker
    state: started
  when: container_engine == "Docker"

- name: Ensure the Podman service is started
  systemd:
    name: podman
    state: started
  when: container_engine == "Podman"

- name: Ensure the Podman socket is started
  systemd:
    name: podman.socket
    state: started
  when: container_engine == "Podman"

- name: Check runtime SELinux mode before install
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/base/general/detect_selinux.yml"

- name: Check if an installation or upgrade should be performed
  shell: '{{ container_engine | lower }} ps -a -f name=frc-runners-runner --format {%raw%}"{{.Image}}"{%endraw%}'
  register: existing_runner
  # become: true
  # become_user: root

- name: Create memory settings
  set_fact:
    memory_settings: ' {"runner":{"xms":"{{memory.runner}}","xmx":"{{memory.runner}}"},"proxy":{"xms":"{{memory.proxy}}","xmx":"{{memory.proxy}}"},"zookeeper":{"xms":"{{memory.zookeeper}}","xmx":"{{memory.zookeeper}}"},"director":{"xms":"{{memory.director}}","xmx":"{{memory.director}}"},"constructor":{"xms":"{{memory.constructor}}","xmx":"{{memory.constructor}}"},"admin-console":{"xms":"{{memory.adminconsole}}","xmx":"{{memory.adminconsole}}"}}'

- name: Install Elastic Cloud Enterprise
  block:
    - include_tasks: primary/main.yml
      when: ece_primary is defined and ece_primary

    - include_tasks: secondary/main.yml
      when: ece_primary is undefined or not ece_primary

    - debug:
        msg: "Adminconsole is reachable at: https://{{ primary_hostname }}:12443"
    - debug:
        msg: "Adminconsole password is: {{ adminconsole_root_password }}"
  when: existing_runner.stdout == ""

- include_tasks: upgrade.yml
  when: existing_runner.stdout != ""
