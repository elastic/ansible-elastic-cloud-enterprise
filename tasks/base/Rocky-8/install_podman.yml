---
- name: Configure SELinux mode for Podman hosts
  ansible.posix.selinux:
    state: "{{ ece_selinux_mode }}"
    policy: "{{ 'targeted' if ece_selinux_mode != 'disabled' else omit }}"
  when: ece_selinux_mode != "os-default"

# A podman_version that matches a podman_version_map key installs that entry's
# packages (e.g. "4.9.4" -> the pinned 4.9.4 RPMs). Any other value is treated
# as an explicit version prefix so CI matrix values like podman-4.9 (passed as
# podman_version=4.9) install podman-4.9* / podman-remote-4.9*, matching the
# Rocky 9 resolver and the legacy ce-aws shell path (`dnf install podman-4.9*`).
- name: Resolve Podman packages
  set_fact:
    podman_packages: >-
      {{ podman_version_map[podman_version]['package']
         if podman_version in podman_version_map
         else ['podman-' ~ podman_version ~ '*', 'podman-remote-' ~ podman_version ~ '*'] }}

- name: Install Podman
  package:
    name: "{{ podman_packages }}"
    state: present

- name: Verify that fs.may_detach_mounts is enabled
  lineinfile:
    path: /etc/sysctl.conf
    regexp: '^fs.may_detach_mounts'
    line: 'fs.may_detach_mounts = 1'
    create: yes
