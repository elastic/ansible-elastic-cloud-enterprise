---
- name: Include OS specific vars
  include_vars: "{{ item }}"
  with_first_found:
  - os_{{ ansible_distribution }}_{{ ansible_distribution_major_version }}.yml
  - unsupported.yml

- name: Check that OS is supported
  fail:
    msg: "ERROR: OS {{ ansible_distribution }} {{ ansible_distribution_major_version}} is not supported!"
  when: unsupported_version is defined and unsupported_version

- name: Warn when OS support is experimental
  debug:
    msg: >-
      WARNING: {{ ansible_distribution }} {{ ansible_distribution_major_version }}
      support in this role is EXPERIMENTAL. Proceeding anyway because
      ece_os_experimental=true.
  when: ece_os_experimental | default(false) | bool

# RHEL 8/9 ship both Docker and Podman maps. Pick the engine from the version
# extra-var the caller actually set. Empty strings (CI passing docker_version=
# or podman_version=) are ignored. A docker_version that starts with "podman"
# is a CI env label (e.g. podman-default-4), not a Docker release.
# If both a real podman_version and a real docker_version are set, Podman wins.
- name: Select Podman when a version is requested and this OS supports it
  set_fact:
    container_engine: Podman
  when:
    - podman_version | default('') | string | length > 0
    - podman_version_map is defined

- name: Select Docker when a version is requested and this OS supports it
  set_fact:
    container_engine: Docker
  when:
    - docker_version | default('') | string | length > 0
    - docker_version is not match('^podman')
    - docker_version_map is defined
    - not (podman_version | default('') | string | length > 0 and podman_version_map is defined)

# default(..., true) so an empty string (e.g. docker_version= passed through from
# an unset CI variable) also falls back to the map default, not just an undefined
# value.
- name: Set Docker version
  set_fact:
    docker_version: "{{ docker_version | default(docker_version_map.keys()|list|last, true) }}"
  when: container_engine == "Docker"

- name: Set Podman version
  set_fact:
    podman_version: "{{ podman_version | default(podman_version_map.keys()|list|last, true) }}"
  when: container_engine == "Podman"

- name: Assert Docker version is supported
  assert:
    that: "docker_version in docker_version_map.keys()"
    msg: "Docker version must be one of {{ docker_version_map.keys() }}"
  when: container_engine == "Docker"

- name: Assert Podman version is supported
  assert:
    that: "podman_version in podman_version_map.keys() or podman_version is match('^[0-9][0-9.]*$')"
    msg: "Podman version must be one of {{ podman_version_map.keys() }} (latest patch of that major) or an explicit version such as 5.2.3"
  when: container_engine == "Podman"

- name: Assert SELinux mode is supported
  assert:
    that: ece_selinux_mode in ["os-default", "disabled", "permissive", "enforcing"]
    msg: "ece_selinux_mode must be one of: os-default, disabled, permissive, enforcing"

- name: Assert firewalld mode is supported
  assert:
    that: ece_firewalld_mode in ["os-default", "disabled", "enabled"]
    msg: "ece_firewalld_mode must be one of: os-default, disabled, enabled"

- name: execute os specific tasks
  include_tasks: "{{ ansible_distribution }}-{{ ansible_distribution_major_version}}/main.yml"

- include_tasks: general/dependencies.yml

- include_tasks: general/make_user.yml
- include_tasks: general/set_limits.yml
  tags: [setup_filesystem, destructive]
  when: ansible_lvm['vgs']['lxc'] is not defined or force_xfc == true
- include_tasks: general/update_grub_docker.yml
  tags: [setup_filesystem, destructive]
- include_tasks: general/configure_docker.yml
  tags: [install_docker, destructive]
  when: container_engine == "Docker"
- include_tasks: general/configure_podman.yml
  tags: [install_podman, install_docker, destructive]
  when: container_engine == "Podman"
- include_tasks: general/configure_podman_ipv6_network.yml
  tags: [install_podman, install_docker, destructive]
  when:
    - container_engine == "Podman"
    - ece_podman_ipv6_network | default(false) | bool
- include_tasks: general/sysctl_scripts.yml
- include_tasks: general/kernel_modules.yml

- name: skip automatic ephemeral mount
  copy:
    dest: /etc/cloud/cloud.cfg.d/01-mounts.cfg
    content: |
      mounts:
        - [ ephemeral0, null ]
