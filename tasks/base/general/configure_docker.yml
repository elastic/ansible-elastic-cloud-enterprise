---
- name: Stop the docker socket
  systemd:
    name: docker.socket
    state: stopped
  failed_when: false

- name: Stop the docker service
  systemd:
    name: docker
    state: stopped
  failed_when: false

- name: Unmount any lingering mounts under /var/lib/docker
  shell: |
    mounts=$(mount | awk '$3 ~ "^/var/lib/docker(/|$)" { print $3 }' | sort -r)
    if [ -n "$mounts" ]; then
      echo "$mounts" | xargs umount -l && echo "$mounts"
    fi
  register: docker_umount_result
  changed_when: docker_umount_result.stdout != ""

- name: Ensures /etc/systemd/system/docker.service.d dir exists
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
  when: docker_version != '1.13'

- name: Create service.d docker.conf
  template:
    src: docker.conf
    dest: /etc/systemd/system/docker.service.d/docker.conf
  when: docker_version != '1.13'

- name: set docker storage options
  lineinfile:
    path: /etc/sysconfig/docker
    regexp: "^OPTIONS='(.*)'"
    line: "OPTIONS='-g {{ data_dir }}/docker \\1'"
    backrefs: yes
    create: yes
  when: docker_version == '1.13'

- name: set docker network options
  lineinfile:
    path: /etc/sysconfig/docker-network
    regexp: '^DOCKER_NETWORK_OPTIONS='
    line: 'DOCKER_NETWORK_OPTIONS="--bip={{ docker_bridge_ip }}"'
    create: yes
  when: docker_version == '1.13'

- name: set docker storage driver
  lineinfile:
    path: /etc/sysconfig/docker-storage-setup
    regexp: '^DOCKER_NETWORK_OPTIONS='
    line: 'STORAGE_DRIVER={{ docker_storage_driver }}'
    create: yes
  when: docker_version == '1.13'

- name: Remove var/lib/docker
  file:
    path: /var/lib/docker
    state: absent
    force: yes

# Official host-prep puts default-ulimits in daemon.json only. Do not also pass dockerd --default-ulimit
# flags; Docker refuses the same directive in both places. Render via the template module so Hard/Soft
# are JSON numbers (quoted Jinja in YAML becomes a string; lookup|from_json breaks when the lookup
# already returns a dict). Merge keeps existing keys (e.g. IPv6).
- name: Ensure /etc/docker exists
  file:
    path: /etc/docker
    state: directory
    mode: "0755"
  when: docker_version != '1.13'

- name: Stat existing Docker daemon.json
  stat:
    path: /etc/docker/daemon.json
  register: ece_docker_daemon_stat
  when: docker_version != '1.13'

- name: Read existing Docker daemon.json
  slurp:
    path: /etc/docker/daemon.json
  register: ece_docker_daemon_slurp
  when:
    - docker_version != '1.13'
    - ece_docker_daemon_stat.stat.exists | default(false)

- name: Render ECE Docker daemon settings
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json.ece
    mode: "0600"
  when: docker_version != '1.13'

- name: Read rendered ECE Docker daemon settings
  slurp:
    path: /etc/docker/daemon.json.ece
  register: ece_docker_daemon_rendered
  when: docker_version != '1.13'

- name: Merge ECE settings into Docker daemon.json
  copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: "{{ (ece_docker_daemon_rendered.content | b64decode | from_json) | combine(ece_docker_daemon_existing, recursive=True) | to_nice_json }}\n"
  vars:
    ece_docker_daemon_existing: "{{ (ece_docker_daemon_slurp.content | b64decode | from_json) if (ece_docker_daemon_stat.stat.exists | default(false)) else {} }}"
  when: docker_version != '1.13'

- name: Docker daemon is enabled and systemd has read all changes
  systemd:
    name: docker
    enabled: yes
    daemon_reload: yes
