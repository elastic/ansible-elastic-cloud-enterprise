---
- name: Change owner of {{ data_dir }}
  file:
    path: "{{ data_dir }}"
    owner: elastic
    group: elastic
    mode: 0700
    state: directory

- name: Change owner and permissions of {{ data_dir }}/elastic
  file:
    path: "{{ data_dir }}/elastic"
    state: directory
    owner: elastic
    group: elastic
    mode: 0700

- name: Change owner and permissions of {{ data_dir }}/docker
  file:
    path: "{{ data_dir }}/docker"
    state: directory
    owner: elastic
    group: elastic
    mode: 0700
  when: container_engine == "Docker"

# Podman's graphroot is relocated here (see configure_podman.yml). Create the
# directory now that the data volume is mounted so rootful Podman stores stack
# images on the large volume instead of the root disk. runroot stays on Podman's
# default tmpfs (/run) and is managed by Podman, so it is not created here.
- name: Create {{ data_dir }}/docker for Podman image storage
  file:
    path: "{{ data_dir }}/docker"
    state: directory
    owner: root
    group: root
    mode: 0711
  when: container_engine == "Podman"
