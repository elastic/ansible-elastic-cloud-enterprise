---
# RHEL 10 ships Podman 5 with netavark as the default network backend.
# Unlike RHEL/Rocky 9 (where ECE still requires CNI), keep the OS default here:
# containernetworking-plugins is not available on RHEL 10, and our ce-aws
# Terraform podman_rhel module likewise leaves netavark alone on RHEL 10+.
#
# Only ensure containers.conf exists and strip any stale network_backend pin
# (e.g. leftover "cni" from an older image/playbook) so Podman falls back to
# netavark.
- name: Ensure /etc/containers/containers.conf exists
  copy:
    src: /usr/share/containers/containers.conf
    dest: /etc/containers/containers.conf
    remote_src: true
    force: false

# Quote the name: an unquoted "default: netavark" is invalid YAML (colon mapping).
- name: "Leave network_backend unset so Podman uses RHEL 10 default (netavark)"
  ansible.builtin.lineinfile:
    path: /etc/containers/containers.conf
    regexp: '^\s*network_backend\s*='
    state: absent
