---
# RHEL 10 does not ship containernetworking-plugins (CNI). Podman 5 uses
# netavark by default; do not pull CNI packages that are unavailable / unused.
- name: Install base dependencies
  package:
    name: "{{ item }}"
    state: present
  with_items:
  - lvm2
  - iptables
  - sysstat
  - net-tools
  - policycoreutils-python-utils
