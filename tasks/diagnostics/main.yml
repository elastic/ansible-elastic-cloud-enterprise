---
- name: Create path /tmp/elastic
  ansible.builtin.file:
    path: /tmp/elastic/ece-support-diagnostics
    state: directory
    mode: "0755"
  delegate_to: localhost

- name: Download ece support diagnostics
  ansible.builtin.get_url:
    url: "{{ ece_supportdiagnostics_url }}"
    dest: /tmp/elastic/ece-support-diagnostics.tar.gz
    mode: "0755"
  delegate_to: localhost

- name: Unzip downloaded ece support diagnostics
  ansible.builtin.unarchive:
    src: /tmp/elastic/ece-support-diagnostics.tar.gz
    dest: /tmp/elastic/
  delegate_to: localhost

# 2.x -dist includes helper binaries next to ece-diagnostics.sh; copy the
# whole tree so those stay on PATH relative to the script (DIR).
- name: Copy ece support diagnostics to the remote host
  ansible.builtin.copy:
    src: /tmp/elastic/ece-support-diagnostics-v{{ ece_supportdiagnostics_version }}/
    dest: /tmp/elastic/ece-support-diagnostics-v{{ ece_supportdiagnostics_version }}/
    mode: preserve

- name: Run ece support diagnostics
  ansible.builtin.command:
    cmd: /tmp/elastic/ece-support-diagnostics-v{{ ece_supportdiagnostics_version }}/ece-diagnostics.sh -s -d
    chdir: /tmp/elastic/ece-support-diagnostics-v{{ ece_supportdiagnostics_version }}

- name: Find generated diagnostic bundles
  ansible.builtin.find:
    paths: /tmp
    patterns: ece_diag*.tar.gz
  register: ece_diag_bundles

- name: Download diagnostic bundles to ansible host and save under {{ ece_supportdiagnostics_result_path }}
  ansible.builtin.fetch:
    src: "{{ item.path }}"
    dest: "{{ ece_supportdiagnostics_result_path }}"
  loop: "{{ ece_diag_bundles.files }}"
  loop_control:
    label: "{{ item.path }}"
