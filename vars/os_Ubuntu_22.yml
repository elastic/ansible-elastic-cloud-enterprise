---
docker_unit_after: "multi-user.target"
docker_storage_driver: overlay2
bootloader_update_command: update-grub
conntrack_module: xt_conntrack
container_engine: Docker

# Docker version mapping. Ubuntu 22.04 is "jammy". Pins come from
# vars/docker_bundles.yml (containerd 1.7.* so apt does not take jammy 2.x).
#   "24" / "25"     — latest patch of that major
#   "24.0" / "25.0" — that minor line only
# The last key is the default when no docker_version is requested.
docker_version_map:
  "24.0":
    pkg_style: apt
    repo: deb https://download.docker.com/linux/ubuntu jammy stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
  "24":
    pkg_style: apt
    repo: deb https://download.docker.com/linux/ubuntu jammy stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
  "25.0":
    pkg_style: apt
    repo: deb https://download.docker.com/linux/ubuntu jammy stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
  "25":
    pkg_style: apt
    repo: deb https://download.docker.com/linux/ubuntu jammy stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
