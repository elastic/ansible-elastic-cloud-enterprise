---
docker_unit_after: "multi-user.target"
docker_storage_driver: overlay2
bootloader_update_command: update-grub
conntrack_module: xt_conntrack
container_engine: Docker

# Docker version mapping. Docker pins come from vars/docker_bundles.yml.
# Bionic's pool tops out at containerd 1.6.21
# (https://download.docker.com/linux/ubuntu/dists/bionic/pool/stable/amd64/).
docker_version_map:
  "19.03":
    pkg_style: apt
    containerd: "1.6.21-1*"
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu bionic stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
