---
docker_unit_after: "multi-user.target"
docker_storage_driver: overlay2
bootloader_update_command: update-grub
conntrack_module: ip_conntrack
container_engine: Docker

# Docker version mapping. Docker pins come from vars/docker_bundles.yml.
# Xenial's Docker apt pool is frozen; containerd 1.4.6 is the last build
# (https://download.docker.com/linux/ubuntu/dists/xenial/pool/stable/amd64/).
docker_version_map:
  "18.09":
    pkg_style: apt
    containerd: "1.4.6-1*"
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu xenial stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
  "19.03":
    pkg_style: apt
    containerd: "1.4.6-1*"
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu xenial stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
