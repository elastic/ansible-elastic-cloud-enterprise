---
docker_unit_after: "multi-user.target"
docker_storage_driver: overlay2
bootloader_update_command: update-grub
conntrack_module: xt_conntrack
container_engine: Docker

# Docker version mapping.
# "20.10" keeps the focal docker 20.10.14 package and the shared 1.6.28 containerd pin.
# "27" is latest 27.x; "27.0" is the 27.0 line only. containerd 1.7.* is latest 1.x on focal.
# The last key is the default when no docker_version is requested.
docker_version_map:
  "20.10":
    package:
      - docker-ce=5:20.10.14*
      - docker-ce-cli=5:20.10.14*
      - containerd.io=1.6.28*
    repo: deb https://download.docker.com/linux/ubuntu focal stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
  "27.0":
    package:
      - docker-ce=5:27.0.*
      - docker-ce-cli=5:27.0.*
      - containerd.io=1.7.*
    repo: deb https://download.docker.com/linux/ubuntu focal stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
  "27":
    package:
      - docker-ce=5:27.*
      - docker-ce-cli=5:27.*
      - containerd.io=1.7.*
    repo: deb https://download.docker.com/linux/ubuntu focal stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
