---
docker_unit_after: "multi-user.target"
docker_storage_driver: overlay2
bootloader_update_command: update-grub
conntrack_module: xt_conntrack
container_engine: Docker

# Docker version mapping. Pins come from vars/docker_bundles.yml.
# "20.10" uses docker 20.10.14 (the focal package); containerd is the bundle 1.6.28.
# "27" is latest 27.x; "27.0" is the 27.0 line only.
# The last key is the default when no docker_version is requested.
docker_version_map:
  "20.10":
    pkg_style: apt
    docker: "20.10.14"
    repo: deb https://download.docker.com/linux/ubuntu focal stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
  "27.0":
    pkg_style: apt
    repo: deb https://download.docker.com/linux/ubuntu focal stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
  "27":
    pkg_style: apt
    repo: deb https://download.docker.com/linux/ubuntu focal stable
    keys:
      server: https://download.docker.com/linux/ubuntu/gpg
      id: 0EBFCD88
